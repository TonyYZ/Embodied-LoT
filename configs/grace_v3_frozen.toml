# FROZEN configuration for GRACE x Embodied-LoT, written 2026-10-17.
# Selected on the validation actors only: setting 'lambda1_beta250' (validation top-1 0.308, MRR 0.478).
# Overrides applied to configs/grace_v3.toml: ['inference.lambda_size=1.0', 'inference.beta=250.0']
# The test actors have NOT been evaluated. Do not edit this file after the test is run.

[data]
raw_dir = "GRACE video database"
processed_dir = "data/processed"
results_dir = "results/grace_v3/final"
model_path = "data/models/pose_landmarker_heavy.task"
similarity_csv = "GRACE video database/Norming_Study_3.csv"
substitutes = { "10F_scurrying.mp4" = "11F_scurrying.mp4" }

[preprocess]
min_visibility = 0.5
edge_margin = 0.01
frames = 16
field_size = 12
window_x = [-0.65, 0.65]
window_y = [-0.6, 0.7]
thickness = 0.08
raster_scale = 8

[lot]
imagined_evaluation = "full"
dynamics = "ludo"
unknown_background = true
tree_placed_bodies = true
motion_away_from_figure = true
orienting_templates = true
tree_sized_bodies = false                 # pinned: bodies had size and speed parameters in these results
motion_kinds = false                      # pinned: every motion trigram moved bodies in bulk in these results
primitives = ["top", "center", "upper", "bottom", "periphery", "lower", "universal", "void"]
compositions = ["parallel", "serial_h", "serial_v", "plan", "body"]
allow_dynamic = true
body_positions = [0.25, 0.5, 0.75]
body_extents = [0.34, 0.5, 0.67, 1.0]
body_speeds = [0.0, 0.03, 0.06]
max_depth = 4
max_nodes = 10
p_leaf = 0.55
max_children = 3
max_dashed = 3
dashed_targets = "any"

[inference]
prior = "description_length"
lambda_size = 1.0
body_param_cost = 0.5
dashed_cost = 1.0
beta = 250.0
distance = "euclid"
iterations = 40000
burn_in = 10000
thin = 30
chains = 4
seed = 1
move_weights = { regenerate = 0.2, leaf = 0.15, composition = 0.08, body = 0.07, swap = 0.05, add_dashed = 0.08, remove_dashed = 0.08, wrap = 0.06, unwrap = 0.06, add_child = 0.085, remove_child = 0.085 }
replicas = 12
hot_beta = 20.0
swap_every = 1

[split]
test_actors = ["02M", "04M", "06F", "09F", "11M"]
val_actors = ["01F", "02F", "03F", "07M", "10M"]

[analysis]
n_permutations = 10000
n_bootstrap = 2000
max_pairs = 400
