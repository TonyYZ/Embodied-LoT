# Proof-of-concept configuration: GRACE locomotion x Embodied-LoT.
# Every stage reads its own section, so each one can be changed on its own.

[data]
raw_dir        = "GRACE video database"    # downloaded GRACE release (gitignored)
processed_dir  = "data/processed"          # pose + trajectory caches (gitignored)
results_dir    = "results/grace_poc"
model_path     = "data/models/pose_landmarker_heavy.task"
similarity_csv = "GRACE video database/Norming_Study_3.csv"
# 10F withdrew consent, so her videos are not in the public release.
# Study 3 used 10F_scurrying.mp4; this stand-in (another actor's scurrying)
# is used instead and flagged in every output.
substitutes    = { "10F_scurrying.mp4" = "11F_scurrying.mp4" }

[preprocess]
min_visibility = 0.5     # mean landmark visibility for a frame to count as valid
edge_margin    = 0.01    # all landmarks must lie this far inside the image
frames         = 16      # T: time-normalised length
field_size     = 12      # H = W of the canonical field
window_x       = [-0.65, 0.65]   # canonical window, in body heights
window_y       = [-0.60, 0.70]   # (y points down; 0 = the video's median torso height)
thickness      = 0.08    # limb thickness, in body heights
raster_scale   = 8       # supersampling factor per field cell

[lot]
measure_trees = false                  # pinned: a tree-top dashed source observes its (empty) space
probabilistic_motion = false           # pinned: universal* random pushes, neutral* inert
grouping_nodes = false                 # pinned: these results use plan / body (templates inside the moving unit)
# Grammar for program search. Primitive names come from TRIGRAM_PATTERNS.
primitives     = ["top", "center", "upper", "bottom", "periphery", "lower", "universal", "void"]
compositions   = ["parallel", "serial_h", "serial_v", "plan", "body"]
allow_dynamic  = true
body_positions = [0.25, 0.5, 0.75]       # each coordinate of a body's centre
body_extents   = [0.34, 0.67, 1.0]       # each coordinate of a body's size
body_speeds    = [0.0, 0.03, 0.06]       # step_size per frame
max_depth      = 4
max_nodes      = 10
p_leaf         = 0.55                    # generator: chance that a node is a leaf (before the depth limit)
max_children   = 3                       # generator: number of children uniform over {min..max}
max_dashed     = 3                       # dashed gate edges (source -> leaf); loops through plan(VOID ..) give rhythm
imagined_evaluation = "legacy"             # runs made before imagined subtrees were evaluated; "full" for new runs
dynamics = "legacy"                       # pinned: results in this config were made before the gameboard became the default
unknown_background = false                # pinned: undrawn cells rendered as 0 in these results
tree_placed_bodies = false                # pinned: bodies were placed by their (y, x) parameters in these results
motion_away_from_figure = false           # pinned: horizontal motion used the earlier mirrored sign
orienting_templates = false               # pinned: dynamic templates selected a half-field
tree_sized_bodies = false                 # pinned: bodies had size and speed parameters in these results
motion_kinds = false                      # pinned: every motion trigram moved bodies in bulk in these results

[inference]
prior          = "description_length"   # L(r) = nats to write r with the grammar (see inference/prior.py)
lambda_size    = 1.0        # log p(r) = -lambda * L(r); 1 = proper description-length prior. Chosen on validation actors.
body_param_cost = 0.5       # only used by prior = "node_count"
dashed_cost    = 1.0        # only used by prior = "node_count"
beta           = 1000.0     # log p(v|r) = -beta * D. Chosen only from mixing diagnostics (R-hat), never from human data
distance       = "euclid"   # "euclid" or "dtw"
iterations     = 40000      # recovery tests: 20k gave 21/24 search successes, 40k gave 23/24
burn_in        = 10000
thin           = 30
chains         = 4
seed           = 1
move_weights   = { regenerate = 0.2, leaf = 0.15, composition = 0.08, body = 0.07, swap = 0.05, add_dashed = 0.08, remove_dashed = 0.08, wrap = 0.06, unwrap = 0.06, add_child = 0.085, remove_child = 0.085 }
# Parallel tempering: likelihood exponents geometric from 1 down to tau_min, where the hottest
# replica's total likelihood weight is hot_beta (tau_min = hot_beta / (beta * #videos)). 1 replica = plain MH.
replicas       = 12
hot_beta       = 20.0
swap_every     = 1

[split]
# 25 locomotion actors (01-13 F/M; 10F withdrew consent) -> 15 train / 5 validation / 5 test.
# train:      manner posteriors are inferred from these actors
# validation: chooses lambda and beta by held-out recognition (no human data)
# test:       touched once, for the final held-out recognition result
# Drawn once and not tuned: test = random.Random(2026).sample(25 actors, 5);
# validation = random.Random(2027).sample(remaining 20, 5).
test_actors    = ["02M", "04M", "06F", "09F", "11M"]
val_actors     = ["01F", "02F", "03F", "07M", "10M"]

[selection]
# Grid searched on the validation actors (grace_lot.inference.select).
lambda_size    = [1.0, 2.0, 4.0]
beta           = [250.0, 1000.0, 4000.0]
# Stage 2, at the best (lambda, beta): search bounds, MCMC length and proposal mixture.
[selection.variants]
bigger_search  = ["lot.max_nodes=14", "lot.max_depth=5", "lot.max_dashed=4"]
longer_mcmc    = ["inference.iterations=80000", "inference.burn_in=20000", "inference.thin=60", "inference.replicas=14"]
more_regenerate = ["inference.move_weights={'regenerate': 0.35, 'leaf': 0.15, 'composition': 0.05, 'body': 0.05, 'swap': 0.04, 'add_dashed': 0.06, 'remove_dashed': 0.06, 'wrap': 0.04, 'unwrap': 0.04, 'add_child': 0.08, 'remove_child': 0.08}"]

[analysis]
n_permutations = 10000
n_bootstrap    = 2000
max_pairs      = 400        # posterior sample pairs per action pair
