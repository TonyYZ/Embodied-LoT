# v7: copying, grouping and agency are separate operators (lot.grouping_nodes). `template` copies its material
# into its template's slots and groups nothing (the earlier plan); `field` makes its one child a rigid unit moved
# only from outside; `body` is a field its own dynamic leaves propel every tick. Template copies of a group are
# independent instances. Same limits as grace_v6_parts (max_depth 5, raised to 6 on 26 Oct 2026): only the grouping semantics differ.
# No results yet.

# PROTOTYPE: anonymous outputs matched to body parts in a 3-detector-per-axis activation space.
# Derived from configs/grace_parts.toml. Scanner: sigmoid receptive fields, boundaries 1/3 and 2/3,
# softness scan_softness; activation = max response over salient points. Observed salient points = skeleton
# points (joints + edge_samples per edge, equal salience); LoT salient points = cells >= lot_salience
# (yin bands render at 0.5 = 'unknown'). Not tuned on any data. LoT, prior, sampler, matching unchanged.

[data]
raw_dir = "GRACE video database"
processed_dir = "data/processed"
results_dir = "results/grace_v7_parts"
model_path = "data/models/pose_landmarker_heavy.task"
similarity_csv = "GRACE video database/Norming_Study_3.csv"
substitutes = { "10F_scurrying.mp4" = "11F_scurrying.mp4" }

[preprocess]
min_visibility = 0.5
edge_margin = 0.01
frames = 16
sampling = "cycle2"                      # two detected motion cycles per video, resampled to the frames (grace.temporal)
field_size = 12
window_x = [-0.65, 0.65]
window_y = [-0.6, 0.7]
thickness = 0.08
raster_scale = 8

[lot]
grouping_nodes = true                  # template / field / body as separate operators
measure_trees = true                   # a tree whose top node sends a dashed edge measures its own figure
probabilistic_motion = true            # universal* / neutral* are latent directions, mixed in the likelihood
max_motion_units = 2                   # at most 2 unknown-motion units per program (<= 9 state combinations)
primitives = ["top", "center", "upper", "bottom", "periphery", "lower", "universal", "void", "neutral"]   # neutral: draws nothing; neutral* = unknown whether there is motion
compositions = ["parallel", "serial_h", "serial_v", "template", "field", "body"]
allow_dynamic = true
body_positions = [0.25, 0.5, 0.75]
body_extents = [0.34, 0.67, 1.0]
body_speeds = [0.0, 0.03, 0.06]
max_depth = 6                          # 5 until 26 Oct 2026: containers and carts (nested slots, units) need a level more
max_nodes = 24                         # lenient: room for a loop per limb
p_leaf = 0.55
max_children = 3
dashed_targets = "any"
max_dashed = 5
max_outputs = 6
content_windows = true                 # `out` / `in` are never templates (diag4 ran without this rule)

[inference]
likelihood = "gaussian"                # docs/probabilistic_semantics.md 10-11: normalised density, cell values are p(yang),
                                       # unknown motion mixed, unclaimed cells filled from real part boards (training actors)
                                       # ("probabilistic" = the section 8-9 scorer: beta-implied noise, occupancy background)
cell_draws = 256                       # boards drawn per state combination (fixed seeds, fills shared by all outputs)
noise_floor = 0.1                      # observation noise >= 0.1 x the background variance, per detector
# temperature = 1 / (T F) by default (gaussian only; beta and [selection].beta are unused by it)
background = "occupancy"               # "probabilistic" only
prior = "description_length"
lambda_size = 0.5                      # lenient default; validation chooses from [selection]
body_param_cost = 0.5
dashed_cost = 0.5                      # lenient: rhythm is built from dashed edges
beta = 250.0
temporal_weight = 1.0                  # frame-to-frame changes count (diagnostic value, not selected)
distance = "euclid"
iterations = 40000
burn_in = 10000
thin = 30
chains = 4
seed = 1
move_weights = { regenerate = 0.2, leaf = 0.15, composition = 0.08, body = 0.07, swap = 0.05, add_dashed = 0.08, remove_dashed = 0.08, wrap = 0.06, unwrap = 0.06, add_child = 0.085, remove_child = 0.085 }
replicas = 12
hot_beta = 20.0
ladder = "adaptive"                    # spacing adapts during burn-in so neighbouring replicas swap equally (Run 4: "calibrated" was too hot)
tau_min = 0.05                         # the hottest replica: below about 0.05 replicas sample nearly the prior (Run 4)
swap_every = 1
progress_every = 2000                  # a progress line per chain every this many iterations (0 = none)

[split]
test_actors = ["02M", "04M", "06F", "09F", "11M"]
val_actors = ["01F", "02F", "03F", "07M", "10M"]

[selection]
max_r_hat = 1.1
lambda_size = [0.25, 0.5, 1.0]
beta = [250.0, 1000.0]
temporal_weight = [0.0, 1.0]

[analysis]
n_permutations = 10000
n_bootstrap = 2000
max_pairs = 400

[interface]
representation = "parts_scan"
scan_softness = 0.05
lot_salience = 0.75
edge_samples = 4
observation_cells = true               # parts quantised to the 12 x 12 cells before scanning, like LoT outputs
features = "orient8"                   # mean detectors + principal-axis orientation (tells the diagonals apart)
