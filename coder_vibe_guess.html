<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wild Guess Avatar</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #efe9d6;
      font-family: Georgia, "Times New Roman", serif;
      color: #2f261f;
    }

    svg {
      width: min(94vw, 920px);
      height: auto;
      filter: drop-shadow(0 18px 28px rgba(65, 45, 30, 0.18));
    }

    .caption {
      font: 700 25px/1.2 Georgia, "Times New Roman", serif;
      fill: #3f3025;
    }

    .small {
      font: 15px/1.2 Georgia, "Times New Roman", serif;
      fill: #6a5a4b;
    }

    .mono {
      font: 13px/1.2 "Courier New", monospace;
      fill: #2f3b59;
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 920 560" role="img" aria-label="A playful code sketch of a mystery coder avatar">
    <rect width="920" height="560" rx="24" fill="#f7f0dc"/>

    <!-- Notebook-grid background -->
    <g opacity="0.36" stroke="#d8ccb0" stroke-width="1">
      <path d="M40 60 H880 M40 100 H880 M40 140 H880 M40 180 H880 M40 220 H880 M40 260 H880 M40 300 H880 M40 340 H880 M40 380 H880 M40 420 H880 M40 460 H880 M40 500 H880"/>
      <path d="M80 40 V520 M120 40 V520 M160 40 V520 M200 40 V520 M240 40 V520 M280 40 V520 M320 40 V520 M360 40 V520 M400 40 V520 M440 40 V520 M480 40 V520 M520 40 V520 M560 40 V520 M600 40 V520 M640 40 V520 M680 40 V520 M720 40 V520 M760 40 V520 M800 40 V520 M840 40 V520"/>
    </g>

    <!-- Diagram fragments -->
    <g fill="none" stroke="#3f3b34" stroke-width="3" stroke-linecap="round">
      <path d="M115 190 L190 128 L290 184"/>
      <path d="M190 128 L210 250"/>
      <path d="M590 160 L685 105 L770 170"/>
      <path d="M685 105 L690 245"/>
    </g>
    <g fill="#f7f0dc" stroke="#3f3b34" stroke-width="3">
      <circle cx="115" cy="190" r="12"/>
      <circle cx="190" cy="128" r="12"/>
      <circle cx="290" cy="184" r="12"/>
      <circle cx="210" cy="250" r="12"/>
      <circle cx="590" cy="160" r="12"/>
      <circle cx="685" cy="105" r="12"/>
      <circle cx="770" cy="170" r="12"/>
      <circle cx="690" cy="245" r="12"/>
    </g>

    <!-- Coder figure: deliberately non-specific -->
    <g transform="translate(340 115)">
      <ellipse cx="120" cy="352" rx="155" ry="24" fill="#d0bf9e" opacity="0.5"/>

      <!-- chair/body -->
      <path d="M60 210 C70 170 170 170 182 210 L205 335 H38 Z" fill="#344055"/>
      <path d="M64 222 C92 242 145 244 179 220 L194 335 H48 Z" fill="#5b6e8a"/>

      <!-- head/hair silhouette, intentionally ambiguous -->
      <circle cx="120" cy="108" r="58" fill="#d7a275"/>
      <path d="M66 103 C65 52 101 27 143 38 C181 48 196 88 177 125 C157 96 120 87 72 111 Z" fill="#3f2c24"/>
      <path d="M77 116 C89 154 150 158 169 119" fill="none" stroke="#7c4f36" stroke-width="5" stroke-linecap="round"/>
      <circle cx="101" cy="105" r="6" fill="#2d201b"/>
      <circle cx="143" cy="105" r="6" fill="#2d201b"/>

      <!-- glasses -->
      <g fill="none" stroke="#2d201b" stroke-width="3">
        <circle cx="101" cy="105" r="17"/>
        <circle cx="143" cy="105" r="17"/>
        <path d="M118 105 H126"/>
      </g>

      <!-- hands -->
      <ellipse cx="50" cy="285" rx="24" ry="14" fill="#d7a275" transform="rotate(-16 50 285)"/>
      <ellipse cx="195" cy="285" rx="24" ry="14" fill="#d7a275" transform="rotate(16 195 285)"/>

      <!-- laptop -->
      <path d="M45 255 H200 L182 340 H62 Z" fill="#242b39"/>
      <path d="M65 272 H180 V324 H65 Z" fill="#101827"/>
      <path d="M18 340 H225 L248 372 H0 Z" fill="#707b8c"/>
      <path d="M96 356 H150" stroke="#aab3c2" stroke-width="5" stroke-linecap="round"/>

      <!-- code on screen -->
      <text x="78" y="292" class="mono">gate = idea()</text>
      <text x="78" y="312" class="mono">draw(model)</text>
    </g>

    <!-- Thought bubbles -->
    <g>
      <circle cx="560" cy="125" r="13" fill="#fff8e8" stroke="#b9a78b" stroke-width="2"/>
      <circle cx="595" cy="88" r="20" fill="#fff8e8" stroke="#b9a78b" stroke-width="2"/>
      <rect x="618" y="35" width="210" height="78" rx="16" fill="#fff8e8" stroke="#b9a78b" stroke-width="2"/>
      <text x="642" y="66" class="small">observed?</text>
      <text x="642" y="90" class="small">imagined?</text>
    </g>

    <!-- Tiny guinea pig and crying peach mascots -->
    <g transform="translate(95 375)">
      <ellipse cx="55" cy="62" rx="54" ry="30" fill="#b87945"/>
      <ellipse cx="31" cy="57" rx="28" ry="23" fill="#f4d2a1"/>
      <circle cx="86" cy="50" r="22" fill="#7a4b2a"/>
      <circle cx="92" cy="46" r="4" fill="#14100d"/>
      <ellipse cx="103" cy="55" rx="5" ry="4" fill="#2c1b14"/>
      <text x="0" y="114" class="small">guinea-pig energy</text>
    </g>

    <g transform="translate(710 370)">
      <path d="M33 0 C50 -14 72 4 69 28 C96 31 105 62 88 83 C70 105 34 109 13 91 C-12 70 -3 30 18 22 C18 12 24 5 33 0Z" fill="#ffb17f"/>
      <path d="M54 9 C67 2 82 3 94 12 C77 17 66 25 59 39 C60 27 59 17 54 9Z" fill="#72a85d"/>
      <circle cx="31" cy="50" r="4" fill="#3f2b1f"/>
      <circle cx="63" cy="50" r="4" fill="#3f2b1f"/>
      <path d="M38 75 C46 66 56 66 64 75" fill="none" stroke="#7f3f36" stroke-width="4" stroke-linecap="round"/>
      <path d="M29 58 C21 73 24 84 32 92 C41 80 40 69 29 58Z" fill="#68c9ff"/>
      <path d="M65 58 C57 73 60 84 68 92 C77 80 76 69 65 58Z" fill="#68c9ff"/>
      <text x="-8" y="126" class="small">crying peach mode</text>
    </g>

    <!-- Caption -->
    <text x="64" y="54" class="caption">wild guess: notebook theorist at a code-lab desk</text>
    <text x="64" y="530" class="small">Not an appearance inference. Just a coded vibe sketch.</text>
  </svg>
</body>
</html>
