# --- sources, drains and carried fields (static_fields: fields re-assert their region every tick) ---------------

[[case]]
concept = "growth"
name = "a plant: a seed field under upward motion grows a column"
program = "(parallel (template bottom/V center/H (field universal/H)) bottom/V*)"
frames = [0, 4, 11]
note = "The field is a source: motion carries its substance up, the field refills, so the column lengthens."
[case.boards]
"0" = """
*_*
*_*
*_*
*_*
*#*
*#*
"""
"11" = """
*#*
*#*
*#*
*#*
*#*
*#*
*#*
*#*
"""

[[case]]
concept = "growth"
name = "contrast: the same seed as bare leaves only moves up, it does not grow"
program = "(parallel (template bottom/V center/H universal/H) bottom/V*)"
frames = [11]
expect = "differ"
note = "Bare leaves are an initial condition: the block rises and leaves known emptiness behind."
[case.boards]
"11" = """
*#*
*#*
*#*
*#*
*#*
*#*
*#*
*#*
"""

[[case]]
concept = "drain"
name = "a void field swallows a body that moves into it"
program = "(parallel (template top/V center/H (field void/H)) (template bottom/V center/H (body (parallel universal/H bottom/V*))))"
frames = [0, 11]
note = "The field is a drain: what enters its region is empty again on the next tick, and the body never shows there."
[case.boards]
"0" = """
*.*
***
*o*
"""
"11" = """
*.*
***
***
"""

[[case]]
concept = "growth"
name = "a fountain: a field with motion inside emits up to its own height"
program = "(parallel (template bottom/V center/H (field (parallel universal/H bottom/V*))) void/V)"
frames = [11]
note = "The field's own motion leaf carries its substance out, as far as the field is tall."
[case.boards]
"11" = """
_._
_#_
_#_
"""

[[case]]
concept = "containment"
name = "a carried field: a rigid box (body around a field) is pushed whole by the ball inside"
program = "(serial_h void/V (body (field (parallel periphery/H bottom/V (template center/H center/V (body (parallel universal/H universal/H*)))))) void/V)"
frames = [15]
size = 24
note = "A body carrying a field is the old rigid field: the ball's edge pushes it whole; by frame 15 it has left the middle."
[case.boards]
"15" = """
*****__*****
*****__*****
*****__*****
"""

[[case]]
concept = "contraction"
name = "periphery motion piles a block up at its centre and stops"
program = "(parallel (template center/H center/V universal/H) periphery/V*)"
frames = [11]
note = "In: each row moves only as far as the centre, so the halves pile up instead of passing through each other."
[case.boards]
"11" = """
************
************
************
************
****____****
****####****
****####****
****____****
************
